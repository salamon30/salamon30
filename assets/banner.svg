<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Building AI that works, and proving it does: from sensors and images, through computer-vision and LLM models, to measured evaluation and real-world use</title>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .head { fill: #1f2328; font-size: 30px; font-weight: 700; }
    .accent { fill: #0969da; }
    .sub { fill: #59636e; font-size: 15px; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .eval { fill: #dafbe1; stroke: #4ac26b; }
    .t { fill: #1f2328; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .s { fill: #59636e; font-size: 11.5px; text-anchor: middle; }
    .flow { fill: none; stroke: #8c959f; stroke-width: 2; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
    .dot { fill: #0969da; }
    .loop { fill: none; stroke: #4ac26b; stroke-width: 1.5; stroke-dasharray: 4 4; animation: flow 1.4s linear infinite reverse; }
    .looplab { fill: #1a7f37; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 817px 166px; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .head, .t { fill: #f0f6fc; }
      .accent { fill: #4493f8; }
      .sub, .s { fill: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .eval { fill: #0f3d1d; stroke: #2ea043; }
      .flow { stroke: #656c76; }
      .dot { fill: #4493f8; }
      .loop { stroke: #2ea043; }
      .looplab { fill: #3fb950; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .loop, .pulse { animation: none; }
      .moving { display: none; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect class="bg" x="1" y="1" width="998" height="228" rx="12"/>

  <text class="head" x="32" y="56">Building AI that works, <tspan class="accent">and proving it does.</tspan></text>
  <text class="sub" x="32" y="82">Computer vision and LLM systems, each shipped with the evaluation that shows where it fails.</text>

  <g class="flow" marker-end="url(#a)">
    <path d="M222,166 H268"/>
    <path d="M462,166 H508"/>
    <path d="M702,166 H748"/>
  </g>
  <path class="loop" d="M817,196 V214 H605 V198"/>
  <text class="looplab" x="711" y="209">failures feed the next fix</text>

  <g class="moving">
    <circle class="dot" r="6"><animateMotion dur="5s" repeatCount="indefinite" path="M127,166 H859"/></circle>
    <circle class="dot" r="6" opacity="0"><set attributeName="opacity" to=".6" begin="2.5s"/><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M127,166 H859"/></circle>
  </g>


  <rect class="box" x="32" y="136" width="190" height="60" rx="8"/>
  <rect class="box" x="270" y="136" width="190" height="60" rx="8"/>
  <rect class="box" x="510" y="136" width="190" height="60" rx="8"/>
  <rect class="box eval pulse" x="750" y="136" width="218" height="60" rx="8"/>

  <text class="t" x="127" y="162">Data</text>
  <text class="s" x="127" y="180">images · sensors · text · speech</text>
  <text class="t" x="365" y="162">Models</text>
  <text class="s" x="365" y="180">YOLOv8 · RAG · LLM tool calling</text>
  <text class="t" x="605" y="162">Shipped</text>
  <text class="s" x="605" y="180">FastAPI · Docker · CI · live demos</text>
  <text class="t" x="859" y="162">Measured</text>
  <text class="s" x="859" y="180">held-out sets · multi-fidelity tests</text>
</svg>
